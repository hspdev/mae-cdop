name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CF_API: https://api.cf.us10.hana.ondemand.com
  CF_ORG: NA_GDH_ai-americasdelivery
  CF_SPACE: AIspace
  CF_UAA: https://uaa.cf.us10.hana.ondemand.com

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json
      - name: Install dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci --legacy-peer-deps --ignore-scripts && node scripts/apply-shim.js
      - name: Unit tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit
      - name: Integration tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          SIMULATION_MODE: "true"
          CDS_REQUIRES_DB_CREDENTIALS_URL: ":memory:"

  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g mbt @sap/cds-dk
      - run: mbt build -p cf
      - uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI v8
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf8.tgz
          tar -zxf cf8.tgz
          sudo install -m 0755 cf /usr/local/bin/cf
          /usr/local/bin/cf version

      - name: Install MTA plugin
        run: cf install-plugin multiapps -f

      - name: CF Login via refresh token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          # Step 1: Set API endpoint so CF creates a valid config with Target field
          /usr/local/bin/cf api "${CF_API}"
          # Step 2: Exchange refresh token for new tokens
          RESPONSE=$(curl -s -X POST "${CF_UAA}/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: Basic Y2Y6" \
            -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('access_token','ERROR: '+str(d)))")
          NEW_REFRESH=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('refresh_token',''))")
          if [[ "$ACCESS_TOKEN" == ERROR* ]]; then echo "Token refresh failed: $ACCESS_TOKEN"; exit 1; fi
          echo "Access token obtained (${#ACCESS_TOKEN} chars)"
          # Step 3: Patch tokens into the config that cf api already created (Target already set)
          AT="$ACCESS_TOKEN" RT="$NEW_REFRESH" ORG="${CF_ORG}" SPACE="${CF_SPACE}" python3 -c "import json,os; p=os.path.expanduser('~/.cf/config.json'); cfg=json.load(open(p)) if os.path.exists(p) else {}; cfg.update({'AccessToken':'bearer '+os.environ['AT'],'RefreshToken':os.environ['RT'],'OrganizationFields':{'GUID':'','Name':os.environ['ORG']},'SpaceFields':{'GUID':'','Name':os.environ['SPACE']}}); json.dump(cfg,open(p,'w')); print('Tokens patched, Target='+cfg.get('Target','MISSING'))"
          /usr/local/bin/cf target -o "${CF_ORG}" -s "${CF_SPACE}"
          echo "CF login successful"
          echo "CF login successful"

      - name: Abort conflicting MTA processes
        run: cf deploy -a abort -f 2>&1 | head -3 || true

      - name: Deploy MTA
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          echo "Deploying $MTAR"
          cf deploy "$MTAR" -f --retries 2

      - name: App logs
        if: always()
        run: |
          cf apps 2>&1 || true
          cf logs mae-cap-backend --recent 2>&1 | grep -E "OUT|ERR" | tail -30 || true

      - name: Smoke test
        run: |
          APP_ROUTE=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1 || echo "")
          if [ -n "$APP_ROUTE" ]; then
            curl -sf "https://${APP_ROUTE}/health" && echo "LIVE at https://${APP_ROUTE}"
          else
            cf apps
          fi
