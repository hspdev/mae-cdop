name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CF_API_URL: https://api.cf.us10.hana.ondemand.com
  CF_USERNAME: harish.phadnis@sap.com
  CF_ORG: NA_GDH_ai-americasdelivery
  CF_SPACE: AIspace

jobs:

  # ── Unit & Integration Tests ───────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json

      - name: Install dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci --legacy-peer-deps --ignore-scripts && node scripts/apply-shim.js

      - name: Run unit tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit

      - name: Run integration tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          SIMULATION_MODE: "true"
          CDS_REQUIRES_DB_CREDENTIALS_URL: ":memory:"

  # ── Build MTA ──────────────────────────────────────────────────────────────
  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install MBT
        run: npm install -g mbt

      - name: Install CDS DK
        run: npm install -g @sap/cds-dk

      - name: Build MTA
        run: mbt build -p cf

      - name: Upload MTA archive
        uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  # ── Deploy to BTP CF ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download MTA archive
        uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI v8
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf version

      - name: Install MTA CF plugin
        run: cf install-plugin multiapps -f

      - name: CF Authenticate via token
        env:
          CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          # CF CLI reads CF_ACCESS_TOKEN env var natively for token-based auth
          cf api https://api.cf.us10.hana.ondemand.com
          cf target -o "${{ env.CF_ORG }}" -s "${{ env.CF_SPACE }}"

      - name: Deploy MTA
        env:
          CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          echo "Deploying: $MTAR"
          cf deploy "$MTAR" -f --retries 2

      - name: Smoke test
        run: |
          sleep 30
          APP_ROUTE=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1)
          echo "Testing https://${APP_ROUTE}/health"
          curl -sf "https://${APP_ROUTE}/health"
