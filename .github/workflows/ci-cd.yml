name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CF_API: https://api.cf.us10.hana.ondemand.com
  CF_ORG: NA_GDH_ai-americasdelivery
  CF_SPACE: AIspace

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json
      - name: Install dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci --legacy-peer-deps --ignore-scripts && node scripts/apply-shim.js
      - name: Unit tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit
      - name: Integration tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          SIMULATION_MODE: "true"
          CDS_REQUIRES_DB_CREDENTIALS_URL: ":memory:"

  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g mbt @sap/cds-dk
      - run: mbt build -p cf
      - uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI v7
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v7&source=github" | tar -zx
          sudo mv cf7 /usr/local/bin/cf
          cf version

      - name: Install MTA plugin
        run: cf install-plugin multiapps -f

      - name: CF Login via token
        env:
          CF_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          # Step 1: cf api sets the endpoint — this creates/updates the XDG config
          cf api https://api.cf.us10.hana.ondemand.com
          # Step 2: inject token directly into the config file cf api just wrote
          # We know CF CLI uses $XDG_CONFIG_HOME/cf/config.json on this runner
          node -e "
            const fs=require('fs'),path=require('path'),os=require('os');
            const xdg = process.env.XDG_CONFIG_HOME || path.join(os.homedir(),'.config');
            const xdgCfg = path.join(xdg,'cf','config.json');
            const homeCfg = path.join(os.homedir(),'.cf','config.json');
            const tok = process.env.CF_TOKEN;
            [xdgCfg, homeCfg].forEach(p => {
              try {
                fs.mkdirSync(path.dirname(p),{recursive:true});
                const cfg = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : {};
                cfg.AccessToken = tok;
                if (!cfg.Target) cfg.Target = 'https://api.cf.us10.hana.ondemand.com';
                if (!cfg.ConfigVersion) cfg.ConfigVersion = 3;
                fs.writeFileSync(p, JSON.stringify(cfg,null,2));
                console.log('Token injected into:', p, '(token_len='+tok.length+')');
              } catch(e) { console.log('Could not update', p, ':', e.message); }
            });
          "
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Deploy MTA
        env:
          CF_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          echo "Deploying: $MTAR"
          cf deploy "$MTAR" -f --retries 2

      - name: Smoke test
        run: |
          sleep 30
          APP_ROUTE=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1 || echo "")
          if [ -n "$APP_ROUTE" ]; then
            curl -sf "https://${APP_ROUTE}/health" && echo "✅ Health check PASSED"
          else
            cf apps
          fi
