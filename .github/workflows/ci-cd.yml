name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CF_API: https://api.cf.us10.hana.ondemand.com
  CF_ORG: NA_GDH_ai-americasdelivery
  CF_SPACE: AIspace

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json
      - name: Install dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci --legacy-peer-deps --ignore-scripts && node scripts/apply-shim.js
      - name: Unit tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit
      - name: Integration tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          SIMULATION_MODE: "true"
          CDS_REQUIRES_DB_CREDENTIALS_URL: ":memory:"

  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g mbt @sap/cds-dk
      - run: mbt build -p cf
      - uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI v7
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v7&source=github" | tar -zx
          sudo mv cf7 /usr/local/bin/cf
          cf version

      - name: Install MTA plugin
        run: cf install-plugin multiapps -f

      - name: Write CF config and target
        env:
          CF_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          mkdir -p "$HOME/.cf"
          # Write CF config.json with token — using a temp JS file to avoid quoting issues
          cat > /tmp/write-cf-config.js << 'EOF'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const cfDir = path.join(os.homedir(), '.cf');
          fs.mkdirSync(cfDir, { recursive: true });
          const cfgPath = path.join(cfDir, 'config.json');
          const cfg = {
            ConfigVersion: 3,
            Target: 'https://api.cf.us10.hana.ondemand.com',
            APIVersion: '3.229.0',
            AuthorizationEndpoint: 'https://login.cf.us10.hana.ondemand.com',
            DopplerEndPoint: 'wss://doppler.cf.us10.hana.ondemand.com:443',
            UaaEndpoint: 'https://uaa.cf.us10.hana.ondemand.com',
            RoutingAPIEndpoint: 'https://api.cf.us10.hana.ondemand.com/routing',
            AccessToken: process.env.CF_TOKEN,
            RefreshToken: '',
            OrganizationFields: { GUID: '', Name: 'NA_GDH_ai-americasdelivery' },
            SpaceFields: { GUID: '', Name: 'AIspace' },
            SSLDisabled: false,
            AsyncTimeout: 0,
            ColorEnabled: '',
            Locale: '',
            PluginRepos: [{ Name: 'CF-Community', URL: 'https://plugins.cloudfoundry.org' }],
            MinCLIVersion: '',
            MinRecommendedCLIVersion: ''
          };
          fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2));
          const check = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
          console.log('Config written to:', cfgPath);
          console.log('Target:', check.Target);
          console.log('Token length:', check.AccessToken.length);
          EOF
          node /tmp/write-cf-config.js
          # CF CLI v7 on Ubuntu with XDG_CONFIG_HOME set uses $XDG_CONFIG_HOME/cf/config.json
          # Copy config to XDG path as well
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/cf"
          cp "$HOME/.cf/config.json" "${XDG_CONFIG_HOME:-$HOME/.config}/cf/config.json"
          echo "Config also written to: ${XDG_CONFIG_HOME:-$HOME/.config}/cf/config.json"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Deploy MTA
        env:
          CF_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          echo "Deploying: $MTAR"
          cf deploy "$MTAR" -f --retries 2

      - name: Smoke test
        run: |
          sleep 30
          APP_ROUTE=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1 || echo "")
          if [ -n "$APP_ROUTE" ]; then
            curl -sf "https://${APP_ROUTE}/health" && echo "✅ Health check PASSED"
          else
            cf apps
          fi
