name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:

  # ── Unit & Integration Tests ────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json

      - name: Install CAP Backend Dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci

      - name: Run Unit Tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit -- --coverage

      - name: Run Integration Tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: development

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: assets/mae-cap-backend/coverage/

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: assets/mae-cap-backend
        run: npm ci
      - name: Lint CAP Backend
        working-directory: assets/mae-cap-backend
        run: npm run lint || echo "::warning::Lint warnings found"

  # ── Build MTA ───────────────────────────────────────────────────────────────
  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install MBT
        run: npm install -g mbt

      - name: Install CAP DK
        run: npm install -g @sap/cds-dk

      - name: Build MTA
        run: mbt build -p cf

      - name: Upload MTA Archive
        uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  # ── Deploy to BTP Dev ────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to BTP Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Download MTA Archive
        uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: Install MTA CF Plugin
        run: cf install-plugin multiapps -f

      - name: CF Login
        run: |
          cf login \
            -a ${{ secrets.CF_API_URL }} \
            -u ${{ secrets.CF_USERNAME }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE_DEV }}

      - name: Deploy to CF Dev
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          cf deploy "$MTAR" -f

      - name: Smoke Test
        run: |
          echo "Running post-deploy smoke tests..."
          APP_URL=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1)
          curl -f "https://${APP_URL}/health" && echo "Health check passed"

  # ── Deploy to BTP Production ─────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to BTP Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download MTA Archive
        uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: Install MTA CF Plugin
        run: cf install-plugin multiapps -f

      - name: CF Login (Production)
        run: |
          cf login \
            -a ${{ secrets.CF_API_URL }} \
            -u ${{ secrets.CF_USERNAME }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE_PROD }}

      - name: Deploy to CF Production
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          cf deploy "$MTAR" -f --retries 3
