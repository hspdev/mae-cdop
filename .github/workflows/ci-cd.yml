name: MAE CDOP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CF_API: https://api.cf.us10.hana.ondemand.com
  CF_ORG: NA_GDH_ai-americasdelivery
  CF_SPACE: AIspace
  CF_UAA: https://uaa.cf.us10.hana.ondemand.com

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/mae-cap-backend/package-lock.json
      - name: Install dependencies
        working-directory: assets/mae-cap-backend
        run: npm ci --legacy-peer-deps --ignore-scripts && node scripts/apply-shim.js
      - name: Unit tests
        working-directory: assets/mae-cap-backend
        run: npm run test:unit
      - name: Integration tests
        working-directory: assets/mae-cap-backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          SIMULATION_MODE: "true"
          CDS_REQUIRES_DB_CREDENTIALS_URL: ":memory:"

  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g mbt @sap/cds-dk
      - run: mbt build -p cf
      - uses: actions/upload-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/*.mtar
          retention-days: 30

  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mta-archive
          path: mta_archives/

      - name: Install CF CLI v7
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v7&source=github" | tar -zx
          sudo mv cf7 /usr/local/bin/cf
          cf version

      - name: Install MTA plugin
        run: cf install-plugin multiapps -f

      - name: CF Login via refresh token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
        run: |
          # Exchange refresh token for a fresh access token via UAA
          echo "Obtaining fresh access token from UAA..."
          RESPONSE=$(curl -s -X POST \
            "${{ env.CF_UAA }}/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: Basic Y2Y6" \
            -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('access_token','ERROR: '+str(d)))")
          NEW_REFRESH=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('refresh_token',''))")

          if [[ "$ACCESS_TOKEN" == ERROR* ]]; then
            echo "Token refresh failed: $ACCESS_TOKEN"
            exit 1
          fi
          echo "✅ Access token obtained (length: ${#ACCESS_TOKEN})"

          # Set CF API endpoint
          cf api ${{ env.CF_API }}

          # Inject fresh token into XDG config (where CF CLI v7 reads on this runner)
          node -e "
            const fs=require('fs'),path=require('path'),os=require('os');
            const tok='bearer '+process.env.ACCESS_TOKEN;
            const xdg=process.env.XDG_CONFIG_HOME||path.join(os.homedir(),'.config');
            [path.join(xdg,'cf','config.json'), path.join(os.homedir(),'.cf','config.json')].forEach(p=>{
              try {
                fs.mkdirSync(path.dirname(p),{recursive:true});
                const cfg=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{ConfigVersion:3,Target:'https://api.cf.us10.hana.ondemand.com'};
                cfg.AccessToken=tok;
                fs.writeFileSync(p,JSON.stringify(cfg,null,2));
                console.log('Token written to:',p);
              } catch(e){console.log('Skip',p,e.message);}
            });
          " ACCESS_TOKEN="$ACCESS_TOKEN"

          cf target -o "$CF_ORG" -s "$CF_SPACE"
          echo "✅ CF login successful"

      - name: Deploy MTA
        run: |
          MTAR=$(ls mta_archives/*.mtar | head -1)
          echo "Deploying: $MTAR"
          cf deploy "$MTAR" -f --retries 2

      - name: Smoke test
        run: |
          sleep 30
          APP_ROUTE=$(cf app mae-cap-backend | grep -oP 'routes:\s+\K\S+' | head -1 || echo "")
          if [ -n "$APP_ROUTE" ]; then
            curl -sf "https://${APP_ROUTE}/health" && echo "✅ Health check PASSED"
          else
            echo "App deployed — checking routes:"
            cf apps
          fi
