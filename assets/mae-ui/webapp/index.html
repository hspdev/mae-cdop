<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAE Customer Data Operations Platform | DUCI</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: '72', Arial, sans-serif; background: #f5f6f7; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; color: #32363a;
    }
    #loading h2 { font-size: 1.4rem; margin-bottom: 8px; }
    #loading p  { color: #6a6d70; font-size: 0.9rem; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e5e5e5;
      border-top-color: #0070f2; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="sapUiBody">

  <!-- Loading indicator shown until UI5 boots -->
  <div id="loading">
    <div class="spinner"></div>
    <h2>MAE Customer Data Operations Platform</h2>
    <p>Demo Utilities Company Inc. &mdash; Loading&hellip;</p>
  </div>

  <div id="content"
    data-sap-ui-component
    data-name="com.duci.mae.cdop"
    data-settings='{"id":"cdop"}'
    style="height:100%; display:none">
  </div>

  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"com.duci.mae.cdop":"./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
  </script>

  <script>
    // Show app content once UI5 core is ready, hide loading spinner
    sap.ui.getCore().attachInit(function () {
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
    });

    // Fallback: if UI5 doesn't load in 15s, show error
    setTimeout(function () {
      var loading = document.getElementById("loading");
      if (loading && loading.style.display !== "none") {
        loading.innerHTML =
          '<h2 style="color:#bb0000">Unable to load UI5 resources</h2>' +
          '<p>Check your network connection or try refreshing the page.</p>' +
          '<button onclick="location.reload()" style="padding:8px 16px;margin-top:12px;cursor:pointer">Reload</button>';
      }
    }, 15000);
  </script>
</body>
</html>
