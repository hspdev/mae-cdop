apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: mae-cap-backend
  version: 1.0.0

type: cap-app

container:
  port: 4004
  env:
    PORT: "4004"
    NODE_ENV: production
    LOG_LEVEL: info
    MAX_RETRY_COUNT: "3"
    RETRY_BASE_DELAY_MS: "1000"
    BATCH_CHUNK_SIZE: "500"
    SIMULATION_MODE: "false"

provides:
  protocols:
    - odata-v4

probes:
  startup:
    path: /health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
