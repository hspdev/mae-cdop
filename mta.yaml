_schema-version: "3.1"
ID: mae-cdop
version: 1.0.0
description: MAE Autonomous Customer Data Operations Platform - DUCI Demo

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix assets/mae-cap-backend ci --legacy-peer-deps --ignore-scripts
        - node assets/mae-cap-backend/scripts/apply-shim.js
        - npm --prefix assets/mae-cap-backend run build

modules:

  # ── CAP Backend (SQLite, no HANA required) ─────────────────────────────────
  - name: mae-cap-backend
    type: nodejs
    path: assets/mae-cap-backend
    build-parameters:
      builder: npm
      build-result: gen/srv
      ignore: [".env", "node_modules/", "test/", "*.db"]
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 1G
      health-check-type: http
      health-check-http-endpoint: /health
    provides:
      - name: mae-cap-backend-srv-url
        properties:
          srv-url: ${default-url}
    properties:
      NODE_ENV: production
      LOG_LEVEL: info
      MAX_RETRY_COUNT: "3"
      RETRY_BASE_DELAY_MS: "1000"
      BATCH_CHUNK_SIZE: "500"
      SIMULATION_MODE: "false"

  # ── SAPUI5 Approuter ───────────────────────────────────────────────────────
  - name: mae-ui-approuter
    type: approuter.nodejs
    path: assets/mae-ui
    build-parameters:
      builder: npm
      ignore: ["node_modules/"]
    parameters:
      keep-existing-routes: true
      memory: 128M
      disk-quota: 256M
    requires:
      - name: mae-cap-backend-srv-url
        group: destinations
        properties:
          name: mae-cap-backend
          url: ~{srv-url}
          forwardAuthToken: false
