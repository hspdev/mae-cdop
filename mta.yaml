_schema-version: "3.1"
ID: mae-cdop
version: 1.0.0
description: MAE Autonomous Customer Data Operations Platform - DUCI Demo

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix assets/mae-cap-backend install --legacy-peer-deps --ignore-scripts
        - node assets/mae-cap-backend/scripts/apply-shim.js
        - node assets/mae-cap-backend/node_modules/@sap/cds-dk/bin/cds.js build --project assets/mae-cap-backend --production
        - mkdir -p assets/mae-cap-backend/gen/srv/patches
        - cp assets/mae-cap-backend/patches/better-sqlite3-sqljs-shim.js assets/mae-cap-backend/gen/srv/patches/
        - mkdir -p assets/mae-cap-backend/gen/srv/scripts
        - cp assets/mae-cap-backend/scripts/apply-shim.js assets/mae-cap-backend/gen/srv/scripts/
        - node -e "const fs=require('fs');const p='assets/mae-cap-backend/gen/srv/package.json';const pkg=JSON.parse(fs.readFileSync(p));pkg.scripts=pkg.scripts||{};pkg.scripts.postinstall='node scripts/apply-shim.js';pkg.scripts.start='node node_modules/@sap/cds/bin/cds-serve.js';fs.writeFileSync(p,JSON.stringify(pkg,null,2));console.log('Updated gen/srv/package.json');"

modules:

  # ── CAP Backend (SQLite, no HANA required) ─────────────────────────────────
  - name: mae-cap-backend
    type: nodejs
    path: assets/mae-cap-backend/gen/srv
    build-parameters:
      builder: npm
      ignore: [".env", "test/", "*.db"]
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 1G
      health-check-type: http
      health-check-http-endpoint: /health
    provides:
      - name: mae-cap-backend-srv-url
        properties:
          srv-url: ${default-url}
    properties:
      NODE_ENV: production
      LOG_LEVEL: info
      MAX_RETRY_COUNT: "3"
      RETRY_BASE_DELAY_MS: "1000"
      BATCH_CHUNK_SIZE: "500"
      SIMULATION_MODE: "false"

  # ── SAPUI5 Approuter ───────────────────────────────────────────────────────
  - name: mae-ui-approuter
    type: approuter.nodejs
    path: assets/mae-ui
    build-parameters:
      builder: npm
      ignore: ["node_modules/"]
    parameters:
      keep-existing-routes: true
      memory: 128M
      disk-quota: 256M
    requires:
      - name: mae-cap-backend-srv-url
        group: destinations
        properties:
          name: mae-cap-backend
          url: ~{srv-url}
          forwardAuthToken: false
